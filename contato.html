<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Entre em contato com Daniela Tavares para saber mais sobre sua carreira, proposta de estágio, emprego, projetos web e design e esclarecimento de dúvidas"
    />
    <meta name="author" content="Daniela Tavares" />
    <meta
      name="keywords"
      content="contactos,saber,mais,dúvidas,email,telefone"
    />
    <meta
      name="viewport"
      content="width=device-width"
      ,
      initial-scale="1.0/>"
    />
    <title>Portfólio|Contatos</title>
  </head>

  <body>
    <header>
      <h1><strong>Contatos</strong></h1>

      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="contato">
        <!-- sessão de formulário de contatos -->
        <h2><strong>Envie uma mensagem</strong></h2>
        <p>
          Se preferir, pode enviar uma mensagem diretamente através do
          formulário abaixo:
        </p>

        <from action="#" method="GET">
          <fieldset>
            <div>
              <label for="nome">Nome</label> <br />
              <input
                type="text"
                name="nome"
                id="nome"
                placeholder="insira o seu nome"
                required
              />
            </div>

            <div>
              <label for="email">Email:</label><br />
              <input
                type="email"
                name="email"
                id="email"
                placeholder="insira seu email"
                required
              />
            </div>

            <div>
              <label for="telefone">Telefone(opcional)</label> <br />
              <input
                type="telefone"
                name="telefone"
                id="telefone"
                placeholder="(+238) 000 00 00"
              />
            </div>
          </fieldset>

          <fieldset>
            <label>Motivos de contacto</label><br />
            
              <label for="assunto">Assunto:</label><br/>
              <select id="assunto" name="assunto" required>
                <option value="">-- Selecione uma opição --</option>
                <option value="Proposta de estagio">Proposta de estágio</option>
                <option value="projetos ou colaboracoes">
                  Projetos ou colaborações
                </option>
                <option value="Duvidas ou esclarecimento">
                  Dúvidas ou esclarecimento
                </option>
              </select>
        

            <div>
              <label for="mensagem">Mensagem</label><br />
              <textarea
                id="mensagem"
                name="mensagem"
                placeholder="sua mensagem"
                rows="10"
                cols="20 required maxlengh=255"
              ></textarea>
            </div>
            <br />

            <div>
              <label for="resposta">Como preferes receber a resposta?</label
              ><br />

              <input
                type="radio"
                id="telefone"
                name="resposta"
                value="telefone"
                checked
              />
              <label for="telefone">Telefone</label>

              <input type="radio" id="email" name="resposta" value="email" />
              <label for="email">Email</label>
            </div>
            <br />

            <div>
              <label>Autorizo a utilização dos meus dados e aceito os termos de uso da plataforma!</label><br/>
              <label for="autorizacao"></label>
              <input
                type="checkbox"
                value="sim"
                id="autorizacao"
                name="autorizacao"
              />
            </div><br/>
            
          </fieldset>

          <div><br/>
          <button type="submit">Enviar</button>
          <button type="resert">Limpar</button>
          </div>
        </from>
      </section>
    </main>
  </body>
</html>
